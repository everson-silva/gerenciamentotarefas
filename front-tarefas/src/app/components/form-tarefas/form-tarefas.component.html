<div style="border: 1px solid #ccc; padding: 15px; border-radius: 5px; background-color: #f9f9f9;">
  <h3>Nova Tarefa</h3>
  <input type="text" [(ngModel)]="novaTarefa.titulo" placeholder="Título da tarefa" style="width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box;">
  
  <textarea [(ngModel)]="novaTarefa.descricao" placeholder="Descrição" rows="3" style="width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box;"></textarea>
  
  <button (click)="salvar()" style="padding: 10px 15px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
    Salvar Tarefa
  </button>
</div>
